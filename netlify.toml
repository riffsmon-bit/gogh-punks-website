[build]
  command = "npm run site:check"
  publish = "site"

[build.environment]
  NODE_VERSION = "24"

[context.production.environment]
  # Read-only display enrichment is deliberately enabled only in production.
  # The scheduled worker still skips unless OPENSEA_API_KEY is configured.
  BROKER_METADATA_ENABLED = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Netlify Dev's local function tracer does not always retain ESM JSON import
# attributes or sibling .mjs imports. Keep these read/status routes operable in
# the local emulator with the same immutable manifests and shared validators
# used by production. These are public source artifacts, never secrets.
[functions."broker-autonomy-v2-status"]
  included_files = ["deployments/robinhood-automation-v2.json", "deployments/robinhood.json", "broker/src/**/*.mjs", "netlify/functions/_shared/*.mjs"]

[functions."broker-autonomy-v3-status"]
  included_files = ["deployments/robinhood-automation-v3.json", "deployments/robinhood.json", "broker/src/**/*.mjs", "netlify/functions/_shared/*.mjs"]

[functions."broker-nft-withdrawal-assets"]
  included_files = ["deployments/robinhood-automation-v3.json", "deployments/robinhood.json", "broker/src/**/*.mjs", "netlify/functions/_shared/*.mjs", "netlify/functions/broker-nft-withdrawal-status.mjs"]

[[redirects]]
  from = "/punk/*"
  to = "/punk/index.html"
  status = 200

[[headers]]
  for = "/*"

  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'none'; connect-src 'self' https://rpc.mainnet.chain.robinhood.com https://rpc.walletconnect.com https://rpc.walletconnect.org https://relay.walletconnect.com https://relay.walletconnect.org wss://relay.walletconnect.com wss://relay.walletconnect.org https://pulse.walletconnect.com https://pulse.walletconnect.org https://api.web3modal.com https://api.web3modal.org https://keys.walletconnect.com https://keys.walletconnect.org https://notify.walletconnect.com https://notify.walletconnect.org https://echo.walletconnect.com https://echo.walletconnect.org https://push.walletconnect.com https://push.walletconnect.org wss://www.walletlink.org https://cca-lite.coinbase.com; font-src 'self' https://fonts.reown.com; form-action 'self'; frame-ancestors 'none'; frame-src 'self' https://verify.walletconnect.com https://verify.walletconnect.org https://secure.walletconnect.com https://secure.walletconnect.org; img-src 'self' data: https://i.seadn.io https://raw2.seadn.io blob: https://walletconnect.org https://walletconnect.com https://secure.walletconnect.com https://secure.walletconnect.org https://api.web3modal.com https://api.web3modal.org https://tokens-data.1inch.io https://tokens.1inch.io https://ipfs.io https://cdn.zerion.io; object-src 'none'; script-src 'self'; style-src 'self'; upgrade-insecure-requests"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
